<!DOCTYPE html>
<html>
    <head>
        <title>Mapa Saúde</title>
        <link rel="stylesheet" href="style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    </head>
    <body>
        <section class="header">
            <div class="nav">
                <div class="nav-item">
                    SaúdeMap
                </div>
                <div class="nav-item">
                    <input id="search" class="search bar" type="text" placeholder="Pesquise uma cidade, bairro ou unidade de saúde">
                </div>
                <div class="nav-item">
                    <div class="local bar">
                        Minha localização
                    </div>
                </div>
                <div class="nav-item">
                    Sobre
                </div>
            </div>
        </section>
        <section class="mounth">
            <div class="displayer">
                <div class="displaytopic">
                    <label class="title">Cobertura de saúde</label>
                    <label id="total">248 estabelecimentos,</label>
                    <div class="group">
                        <label id="count_ubs">126 UBS,</label>
                        <label id="count_hospitais">34 hospitais,</label>
                        <label id="count_upas">18 UPAs,</label>
                    </div>
                    <label id="count_outros">70 outros</label>
                </div>
                <div class="sectionbreak"></div>
                <div class="displayfilters">
                    <div class="displaysizefilter">
                        <label class="title">Filtros</label>
                        <div class="filter" id="filter_ubs">
                            <input type="checkbox" id="filter_ubs_checkbox" checked readonly>
                            UBS
                        </div>
                        <div class="filter" id="filter_upas">
                        <input type="checkbox" id="filter_upas_checkbox" readonly>
                            UPA
                        </div>
                        <div class="filter" id="filter_hospitais">
                            <input type="checkbox" id="filter_hospitais_checkbox" readonly>
                            Hospital
                        </div>
                        <div class="filter" id="filter_outros">
                            <input type="checkbox" id="filter_outros_checkbox" readonly>
                            Outros
                        </div>
                    </div>
                    <div class="displaysizelevel">
                        <div class="progress-circle displaysizeprogress" style="--progress: 25;"></div>
                        <button class="displaysizebtn">25%</button>
                    </div>
                </div>
                <div class="sectionbreak"></div>
                <div class="displaydistance">
                    <div class="displaytopic">
                        <div class="group">
                            <label class="title">Distancia</label>
                            <label> (m)</label>
                        </div>
                        <div class="scrollbarinput">
                            <div class="line"></div>
                            <div class="ball"></div>
                        </div>
                    </div>
                    <button class="title bar displaysubmit">Aplicar filtros</button>
                </div>
            </div>
            <div id="results"></div>
        </section>
        <div style="width: 100%; height: 100%; overflow: hidden;">
            <iframe width="100%" height="105%" id="map" src="https://www.openstreetmap.org/export/embed?bbox=-84.77050781250001%2C-33.174341551002065%2C-21.7529296875%2C7.798078531355303&amp;layer=mapnik" style="border: none;"></iframe>
        </div>
        <script src="search.js"></script>
    </body>
</html>
